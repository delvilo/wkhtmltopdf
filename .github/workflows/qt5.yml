name: Qt5
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  qt5:
    name: Qt 5.15 on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install packages
        run: sudo apt-get update && sudo apt-get install -y cmake qtbase5-dev libqt5webkit5-dev libqt5svg5-dev
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: regressions
        run: ctest --test-dir build --output-on-failure
